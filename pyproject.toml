[project]
name = "draftroom"
version = "0.1.0"
description = "Fantasy football draft model and live draft assistant"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "rapidfuzz>=3.9",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    # Historical weekly game logs, needed to model the league's per-game yardage bonuses.
    # NOTE: nfl_data_py is dead (archived Sept 2025); nflreadpy is its maintained successor.
    "nflreadpy>=0.1.5",
    # Parses Mike Clay's ESPN draft-kit PDF (prep/clay_pdf.py) -- the only source
    # with a real Tgt/targets column for RB/WR/TE.
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
