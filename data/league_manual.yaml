# ============================================================================
# Allendale Dad League (Yahoo league ID# 180947)
#
# CONFIRMED against the Yahoo "Scoring & Settings" page, read 2026-08-17.
# These are no longer guesses. The only remaining unknown is the draft slot,
# which is not drawn until draft night (the league runs an Offline Draft).
#
# Three of our earlier working assumptions were WRONG and are corrected here:
#   teams   12 -> 10
#   bench    5 -> 6
#   pass_int -1 -> -2   (the league overrode Yahoo's default)
#
# NOT REPRESENTABLE IN THIS FILE -- see `scoring_bonuses` at the bottom.
# The league awards per-GAME yardage bonuses, which a linear points-per-unit
# model cannot express. Read that section before trusting any projection.
# ============================================================================

teams: 10                 # CONFIRMED - "Max Teams: 10", and the 2025 standings list exactly 10.
weeks: 17                 # Regular season. Fantasy playoffs are weeks 15-17 (6 teams).
bench: 6                  # CONFIRMED - BN x6. Excludes the 2 IR slots, which cannot hold
                          # a healthy player and so add no roster demand.
rounds: 15                # CONFIRMED - the 2025 draft ran 15 rounds (9 starters + 6 bench).
draft_slot: null          # UNKNOWN until draft night. Marc had pick 1 in 2025.

# CONFIRMED roster: QB, QB, WR, WR, WR, RB, RB, TE, W/R/T, BN x6, IR x2.
# No kicker. No defense. Exactly as expected, and the reason every public
# ranking is wrong for this league.
starters:
  QB: 2                   # The whole edge lives on this line. 10 teams x 2 = 20 starting QBs.
  RB: 2
  WR: 3
  TE: 1

flex_slots: 1             # CONFIRMED - a single W/R/T.
flex_eligible: [RB, WR, TE]

# --------------------------------------------------------------------------
# Real 2026 team names, read off the Yahoo league page PDF ("Allendale Dad
# League _ Fantasy Football _ Yahoo! Sports.pdf", saved 2026-08-17).
#
# NAME-TO-SLOT MAPPING IS UNKNOWN UNTIL THE DRAW ON DRAFT NIGHT. This list's
# order is arbitrary -- it is NOT team 1, team 2, etc. Marc assigns each name
# to a slot at the table in seconds once the draw happens (see plan A1,
# docs/PLAN_2026-08-20.md). Country Club Boys is Marc's team.
# --------------------------------------------------------------------------
team_names:
  - "Country Club Boys"          # Marc's team (8th place 2025, 4-10-0)
  - "Reese's Pieces"
  - "Jaxson Fart"                # manager: Jay -- also the commissioner
  - "Real Men Make (t)Wins"
  - "Zeroes to Heroes"
  - "Tee Swift"
  - "Penix Envy"
  - "Vandelay Industries"
  - "Aaron and Bailey's Circus"
  - "Unsolicited Nix Pics"

# --------------------------------------------------------------------------
# Scoring: points per unit, keyed by canonical stat name (see CLAUDE.md).
# CONFIRMED from the league's Scoring & Settings page.
# --------------------------------------------------------------------------
scoring:
  pass_yd: 0.04           # CONFIRMED - 25 passing yards per point
  pass_td: 4.0            # CONFIRMED
  pass_int: -2.0          # CONFIRMED - the league OVERRODE Yahoo's default of -1.
                          # Doubling the interception penalty in a league that starts
                          # two quarterbacks is a real, compounding drag: it hits both
                          # starting slots, and it pushes value toward efficient QBs
                          # over high-volume gunslingers.
  pass_2pt: 2.0           # CONFIRMED

  rush_yd: 0.1            # CONFIRMED - 10 rushing yards per point
  rush_td: 6.0            # CONFIRMED
  rush_2pt: 2.0           # CONFIRMED

  rec: 0.5                # CONFIRMED - half PPR.
  rec_yd: 0.1             # CONFIRMED
  rec_td: 6.0             # CONFIRMED
  rec_2pt: 2.0            # CONFIRMED

  fum_lost: -2.0          # CONFIRMED

# --------------------------------------------------------------------------
# PER-GAME YARDAGE BONUSES -- confirmed, and NOT yet modelled.
#
# The league pays milestone bonuses inside a single game:
#     passing    +3 at 300 yds, +1 more at 400, +1 more at 500
#     rushing    +3 at 100 yds, +1 more at 150, +1 more at 200
#     receiving  +3 at 100 yds, +1 more at 150, +1 more at 200
#
# Why this is a genuine modelling problem rather than a footnote:
# a bonus is a threshold on a SINGLE GAME, but every projection source gives
# season totals. A back projected for 1,000 rushing yards could reach it as
# ten 100-yard games (+30 points of bonus) or as seventeen 59-yard games
# (zero bonus). Season totals cannot distinguish those, and the gap between
# them is worth roughly two and a half rounds of draft capital.
#
# Correct treatment is to model the DISTRIBUTION of weekly yardage, not the
# mean, and integrate the bonus over it. That systematically favours
# high-variance, boom-week players over steady compilers -- the opposite of
# what the short-bench logic favours elsewhere, so the two effects have to be
# weighed rather than assumed to cancel.
#
# Until that is built, every projected point total here is BIASED LOW, and
# biased low unevenly: most for workhorse backs and alpha receivers who clear
# 100 yards often, least for committee players who rarely do.
# --------------------------------------------------------------------------
scoring_bonuses:
  pass_yd:
    - {threshold: 300, points: 3}
    - {threshold: 400, points: 1}
    - {threshold: 500, points: 1}
  rush_yd:
    - {threshold: 100, points: 3}
    - {threshold: 150, points: 1}
    - {threshold: 200, points: 1}
  rec_yd:
    - {threshold: 100, points: 3}
    - {threshold: 150, points: 1}
    - {threshold: 200, points: 1}

# Other confirmed settings that do not feed the valuation model but matter
# operationally:
#   scoring_type: Head-to-Head           (not points-against or median)
#   draft_type: Offline                  (the sticker board -- this tool IS the record)
#   playoffs: 6 teams, weeks 15-17
#   fractional_points: yes
#   negative_points: yes
#   waivers: continual rolling list, 2-day
#   trade_deadline: 2026-11-28
#   max_acquisitions: unlimited          (deep waiver churn is available all season,
#                                         which supports the short-bench argument for
#                                         floor over speculative stashes)
